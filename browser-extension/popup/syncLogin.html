<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一鉴到底 - 同步登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 450px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .container {
      background: white;
      margin: 20px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 12px;
      font-size: 28px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }

    .subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #f5f5f5;
      color: #666;
      margin-top: 12px;
    }

    .alert {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .alert-error {
      background: #fee;
      color: #c00;
    }

    .alert-success {
      background: #efe;
      color: #0a0;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 20px 0;
    }

    .help-text {
      font-size: 12px;
      color: #888;
      text-align: center;
      line-height: 1.6;
    }

    .help-text a {
      color: #667eea;
      text-decoration: none;
    }

    .sync-status {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      margin-bottom: 16px;
    }

    .sync-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 12px;
      font-size: 16px;
    }

    .sync-icon.active {
      background: #d4edda;
    }

    .sync-icon.inactive {
      background: #f8d7da;
    }

    .sync-text {
      flex: 1;
    }

    .sync-title {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .sync-desc {
      font-size: 12px;
      color: #888;
    }

    .user-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .user-avatar {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 8px;
      font-size: 24px;
      color: white;
    }

    .user-name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .user-email {
      font-size: 13px;
      color: #888;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 未登录状态 -->
    <div id="loginView">
      <div class="header">
        <div class="logo">🔍</div>
        <div class="title">一鉴到底</div>
        <div class="subtitle">开启云端同步，保护您的创作</div>
      </div>

      <div class="sync-status">
        <div class="sync-icon inactive">☁️</div>
        <div class="sync-text">
          <div class="sync-title">云同步未开启</div>
          <div class="sync-desc">登录后可同步录制数据到云端</div>
        </div>
      </div>

      <div id="errorAlert" class="alert alert-error"></div>
      <div id="successAlert" class="alert alert-success"></div>

      <div class="form-group">
        <label for="username">用户名 / 手机号 / 邮箱</label>
        <input type="text" id="username" placeholder="请输入用户名">
      </div>

      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码">
      </div>

      <button id="btnLogin" class="btn btn-primary">登录并开启同步</button>

      <button id="btnSkip" class="btn btn-secondary">暂不登录，继续本地录制</button>

      <div class="divider"></div>

      <div class="help-text">
        没有账号？<a href="https://yijiandaodi.com/register" target="_blank">立即注册</a><br>
        登录后可同步数据到云端，防止丢失
      </div>
    </div>

    <!-- 已登录状态 -->
    <div id="loggedInView" style="display: none;">
      <div class="header">
        <div class="logo">✅</div>
        <div class="title">同步已开启</div>
        <div class="subtitle">您的创作数据将自动同步到云端</div>
      </div>

      <div class="user-info">
        <div class="user-avatar">👤</div>
        <div class="user-name" id="displayName">用户</div>
        <div class="user-email" id="displayEmail">user@example.com</div>
      </div>

      <div class="sync-status">
        <div class="sync-icon active">☁️</div>
        <div class="sync-text">
          <div class="sync-title">云同步已开启</div>
          <div class="sync-desc">所有录制将自动同步到云端</div>
        </div>
      </div>

      <button id="btnLogout" class="btn btn-secondary">退出登录</button>
    </div>
  </div>

  <script src="syncLogin.js"></script>
</body>
</html>
