<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一鉴到底 - 登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      width: 280px;
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 12px;
      font-size: 28px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 600;
      color: #333;
    }

    .logo-subtitle {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-group input::placeholder {
      color: #bbb;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: #fee;
      color: #c00;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .success-message {
      background: #efe;
      color: #0a0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 20px 0;
    }

    .help-text {
      font-size: 12px;
      color: #888;
      text-align: center;
      line-height: 1.6;
    }

    .help-text a {
      color: #667eea;
      text-decoration: none;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    .user-info {
      display: none;
      text-align: center;
    }

    .user-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 12px;
      font-size: 24px;
      color: white;
    }

    .user-name {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .user-email {
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }

    .btn-logout {
      width: 100%;
      padding: 10px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 6px;
      color: #666;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-logout:hover {
      background: #eee;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- 未登录状态 -->
    <div id="loginForm" class="login-form">
      <div class="logo">
        <div class="logo-icon">🔍</div>
        <div class="logo-text">一鉴到底</div>
        <div class="logo-subtitle">AI内容鉴别与创作溯源平台</div>
      </div>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <div class="form-group">
        <label for="apiToken">API Token</label>
        <input type="password" id="apiToken" placeholder="请输入您的 API Token" autocomplete="off">
      </div>

      <button id="btnLogin" class="btn-login">登录</button>

      <div class="divider"></div>

      <div class="help-text">
        如何获取 API Token？<br>
        登录 <a href="https://yijiandaodi.com" target="_blank">yijiandaodi.com</a><br>
        进入「个人中心 → API管理」创建
      </div>
    </div>

    <!-- 已登录状态 -->
    <div id="userInfo" class="user-info">
      <div class="logo">
        <div class="user-avatar">👤</div>
        <div class="user-name" id="userName">用户</div>
        <div class="user-email" id="userEmail">user@example.com</div>
      </div>

      <div class="form-group">
        <label>登录状态</label>
        <div style="padding: 10px 0; color: #0a0; font-size: 14px;">
          ✅ 已登录 · 数据同步已开启
        </div>
      </div>

      <div style="margin-bottom: 16px; padding: 12px; background: #f5f5f5; border-radius: 6px;">
        <div style="font-size: 12px; color: #888; margin-bottom: 4px;">已同步数据</div>
        <div style="display: flex; justify-content: space-around;">
          <div style="text-align: center;">
            <div style="font-size: 20px; font-weight: 600; color: #667eea;" id="statSessions">0</div>
            <div style="font-size: 11px; color: #888;">会话</div>
          </div>
          <div style="text-align: center;">
            <div style="font-size: 20px; font-weight: 600; color: #764ba2;" id="statOperations">0</div>
            <div style="font-size: 11px; color: #888;">操作</div>
          </div>
          <div style="text-align: center;">
            <div style="font-size: 20px; font-weight: 600; color: #667eea;" id="statPlatforms">0</div>
            <div style="font-size: 11px; color: #888;">平台</div>
          </div>
        </div>
      </div>

      <button id="btnLogout" class="btn-logout">退出登录</button>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
