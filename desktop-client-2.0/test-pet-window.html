<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>小鉴桌宠测试</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 140px;
            height: 170px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-app-region: drag;
        }
        .pet-container {
            position: relative;
            width: 140px;
            height: 170px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pet-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: float 3s ease-in-out infinite, pulse 2s ease-in-out infinite;
        }
        .status-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #58D68D;
            box-shadow: 0 2px 10px rgba(88, 214, 141, 0.8);
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="pet-container">
        <div class="status-indicator"></div>
        <div class="pet-image">鉴</div>
    </div>
</body>
</html>
