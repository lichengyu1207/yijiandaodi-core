name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  release:
    types: [published]

env:
  NODE_VERSION: '18'
  CACHE_VERSION: 'v1'

jobs:
  # ============================================
  # 代码质量检查
  # ============================================
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run build --if-present
        continue-on-error: true

      - name: ESLint 代码检查
        run: npm run lint --if-present
        continue-on-error: true

  # ============================================
  # 单元测试
  # ============================================
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm run test --if-present
        continue-on-error: true

      - name: 上传测试覆盖率报告
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # ============================================
  # 构建测试 - Windows
  # ============================================
  build-windows:
    name: 构建 Windows 应用
    runs-on: windows-latest
    needs: [code-quality, test]
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建应用
        run: npm run electron:build:win

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release-new/*.exe
            release-new/*.zip
          retention-days: 7

  # ============================================
  # 构建测试 - macOS
  # ============================================
  build-macos:
    name: 构建 macOS 应用
    runs-on: macos-latest
    needs: [code-quality, test]
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建应用
        run: npm run electron:build:mac

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            release-new/*.dmg
            release-new/*.zip
          retention-days: 7

  # ============================================
  # 构建测试 - Linux
  # ============================================
  build-linux:
    name: 构建 Linux 应用
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 安装额外依赖（Linux）
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: 构建应用
        run: npm run electron:build:linux

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release-new/*.AppImage
            release-new/*.deb
            release-new/*.rpm
            release-new/*.zip
          retention-days: 7

  # ============================================
  # 自动化发布
  # ============================================
  release:
    name: 发布应用
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: github.event_name == 'release'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 Windows 构建
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./release-new

      - name: 下载 macOS 构建
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./release-new

      - name: 下载 Linux 构建
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./release-new

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: release-new/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布通知
        run: |
          echo "✅ 发布成功！"
          echo "版本: ${{ github.event.release.tag_name }}"
          echo "发布时间: ${{ github.event.release.published_at }}"