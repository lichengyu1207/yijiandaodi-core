# Prometheus监控配置
# 文件：/etc/prometheus/prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - localhost:9093

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # PostgreSQL监控
  - job_name: 'postgresql'
    static_configs:
      - targets: ['localhost:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'yijiandaodi-db'

  # Django应用监控
  - job_name: 'django'
    static_configs:
      - targets: ['localhost:8000']

  # 服务器监控
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']