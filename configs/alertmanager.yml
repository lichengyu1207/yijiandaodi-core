# Alertmanager配置
# 文件：/etc/alertmanager/alertmanager.yml

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.qq.com:587'
  smtp_from: 'your-email@qq.com'
  smtp_auth_username: 'your-email@qq.com'
  smtp_auth_password: 'your-smtp-password'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'team-email'
  
  routes:
    - match:
        severity: critical
      receiver: 'team-email-critical'
      continue: true
      
    - match:
        severity: warning
      receiver: 'team-email'

receivers:
  - name: 'team-email'
    email_configs:
      - to: 'admin@your-domain.com'
        send_resolved: true
        headers:
          Subject: '[一鉴到底] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'
    
  - name: 'team-email-critical'
    email_configs:
      - to: 'admin@your-domain.com,ops@your-domain.com'
        send_resolved: true
        headers:
          Subject: '[紧急] [一鉴到底] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'
    
    # 钉钉通知（可选）
    webhook_configs:
      - url: 'https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']