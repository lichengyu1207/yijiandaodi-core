<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一鉴到底 - AI Agent安全平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 粒子背景 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: radial-gradient(circle, rgba(22, 93, 255, 0.6) 0%, transparent 70%);
            border-radius: 50%;
            animation: particleFloat 10s linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(30px);
                opacity: 0;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* Logo容器 */
        .logo-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 0 auto 60px;
        }

        /* 外部光环 - 旋转 */
        .outer-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280px;
            height: 280px;
            border: 2px solid transparent;
            border-top-color: rgba(22, 93, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ringRotate 3s linear infinite;
            opacity: 0;
        }

        .outer-ring:nth-child(1) {
            animation-delay: 0s;
        }

        .outer-ring:nth-child(2) {
            width: 300px;
            height: 300px;
            border-top-color: rgba(0, 212, 255, 0.6);
            animation-delay: 0.5s;
            animation-direction: reverse;
        }

        .outer-ring:nth-child(3) {
            width: 320px;
            height: 320px;
            border-top-color: rgba(22, 93, 255, 0.4);
            animation-delay: 1s;
        }

        @keyframes ringRotate {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
                opacity: 0;
            }
        }

        /* 内部光晕 */
        .inner-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(22, 93, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        /* Logo图片 - 复杂的旋转展开动画 */
        .logo-img {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            object-fit: contain;
            transform: translate(-50%, -50%);
            
            /* 多重动画叠加 */
            animation: 
                logoScaleIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0s forwards,
                logoRotateIn 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.2s forwards,
                logoGlow 3s ease-in-out infinite 2s;
            
            /* 初始状态 */
            opacity: 0;
            filter: blur(20px) brightness(0.5);
            transform: translate(-50%, -50%) scale(0) rotateZ(180deg) rotateY(180deg);
        }

        /* 缩放入场 */
        @keyframes logoScaleIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0) rotateZ(180deg);
                filter: blur(20px) brightness(0.5);
            }
            60% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.1) rotateZ(0deg);
                filter: blur(5px) brightness(0.8);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotateZ(0deg);
                filter: blur(0px) brightness(1);
            }
        }

        /* 旋转展开 */
        @keyframes logoRotateIn {
            0% {
                transform: translate(-50%, -50%) rotateY(180deg);
            }
            50% {
                transform: translate(-50%, -50%) rotateY(90deg);
            }
            100% {
                transform: translate(-50%, -50%) rotateY(0deg);
            }
        }

        /* 持续发光 */
        @keyframes logoGlow {
            0%, 100% {
                filter: drop-shadow(0 0 30px rgba(22, 93, 255, 0.6))
                        drop-shadow(0 0 60px rgba(0, 212, 255, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 50px rgba(22, 93, 255, 0.9))
                        drop-shadow(0 0 100px rgba(0, 212, 255, 0.6));
            }
        }

        /* 爆炸粒子效果 */
        .explosion-particle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.8) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: explosionParticle 1s ease-out forwards;
        }

        @keyframes explosionParticle {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1);
                opacity: 0;
            }
        }

        /* 标题 */
        .title {
            font-size: 68px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 20px;
            margin-bottom: 30px;
            
            animation: titleSlideUp 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 2s forwards;
            opacity: 0;
            transform: translateY(50px);
            
            text-shadow: 
                0 0 40px rgba(22, 93, 255, 0.8),
                0 0 80px rgba(0, 212, 255, 0.5),
                0 0 120px rgba(22, 93, 255, 0.3);
        }

        @keyframes titleSlideUp {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
                letter-spacing: 50px;
            }
            60% {
                letter-spacing: 15px;
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                letter-spacing: 20px;
            }
        }

        /* 副标题 */
        .subtitle {
            font-size: 24px;
            color: rgba(22, 93, 255, 0.9);
            letter-spacing: 10px;
            font-weight: 500;
            
            animation: subtitleFadeIn 1s ease-out 2.8s forwards;
            opacity: 0;
            transform: translateY(20px);
            
            text-shadow: 0 0 20px rgba(22, 93, 255, 0.5);
        }

        @keyframes subtitleFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 控制按钮 */
        .controls {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 100;
        }

        .control-btn {
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(22, 93, 255, 0.2);
            border-color: rgba(22, 93, 255, 0.4);
            transform: translateY(-2px);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .logo-wrapper {
                width: 160px;
                height: 160px;
            }

            .outer-ring {
                width: 180px;
                height: 180px;
            }

            .outer-ring:nth-child(2) {
                width: 200px;
                height: 200px;
            }

            .outer-ring:nth-child(3) {
                width: 220px;
                height: 220px;
            }

            .inner-glow {
                width: 140px;
                height: 140px;
            }

            .logo-img {
                width: 140px;
                height: 140px;
            }

            .title {
                font-size: 36px;
                letter-spacing: 8px;
            }

            .subtitle {
                font-size: 16px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>

    <!-- 控制按钮 -->
    <div class="controls">
        <button class="control-btn" onclick="replayAnimation()">重新播放</button>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- Logo容器 -->
        <div class="logo-wrapper">
            <!-- 外部旋转光环 -->
            <div class="outer-ring"></div>
            <div class="outer-ring"></div>
            <div class="outer-ring"></div>

            <!-- 内部光晕 -->
            <div class="inner-glow"></div>

            <!-- Logo图片 -->
            <img src="../yi-removebg-preview.png" alt="一鉴到底" class="logo-img" id="logoImg">
        </div>

        <!-- 标题 -->
        <h1 class="title">一鉴到底</h1>
        <p class="subtitle">AI Agent 安全平台</p>
    </div>

    <script>
        // 创建粒子
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 40;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 8) + 's';
                container.appendChild(particle);
            }
        }

        // 创建爆炸粒子
        function createExplosionParticles() {
            const wrapper = document.querySelector('.logo-wrapper');
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'explosion-particle';
                
                // 随机方向
                const angle = (Math.PI * 2 * i) / particleCount;
                const distance = 100 + Math.random() * 50;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.animationDelay = (i * 0.05) + 's';
                
                wrapper.appendChild(particle);
                
                // 1秒后移除
                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        }

        // 重新播放动画
        function replayAnimation() {
            location.reload();
        }

        // Logo出现后触发爆炸效果
        setTimeout(() => {
            createExplosionParticles();
        }, 800);

        // 初始化
        createParticles();
    </script>
</body>
</html>
