<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一鉴到底 - AI Agent安全平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #0A0E1A;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Logo容器 */
        .logo-container {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* Logo图片 */
        .logo-image {
            width: 180px;
            height: 180px;
            object-fit: contain;
            animation: logoFadeIn 2s ease-out, breathe 4s ease-in-out infinite 2s;
            filter: drop-shadow(0 0 40px rgba(22, 93, 255, 0.6));
        }

        /* Logo淡入动画 */
        @keyframes logoFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.6) rotateY(180deg);
            }
            60% {
                opacity: 1;
                transform: scale(1.05) rotateY(0deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        /* Logo呼吸效果 */
        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 40px rgba(22, 93, 255, 0.6));
            }
            50% {
                transform: scale(1.03);
                filter: drop-shadow(0 0 60px rgba(22, 93, 255, 0.9));
            }
        }

        /* 光晕效果 */
        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(22, 93, 255, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 5s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 1;
            }
        }

        /* 标题 */
        .title {
            color: #ffffff;
            font-size: 56px;
            font-weight: 800;
            margin-top: 40px;
            letter-spacing: 12px;
            animation: titleSlideIn 1s ease-out 1.2s both;
        }

        @keyframes titleSlideIn {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 副标题 */
        .subtitle {
            color: rgba(22, 93, 255, 0.9);
            font-size: 20px;
            margin-top: 20px;
            letter-spacing: 6px;
            font-weight: 500;
            animation: subtitleFadeIn 1s ease-out 1.6s both;
        }

        @keyframes subtitleFadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* 核心能力 */
        .capabilities {
            display: flex;
            gap: 60px;
            margin-top: 80px;
            animation: featuresSlideUp 1s ease-out 2s both;
        }

        @keyframes featuresSlideUp {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .capability-item {
            text-align: center;
            padding: 30px;
            background: rgba(22, 93, 255, 0.08);
            border-radius: 16px;
            border: 1px solid rgba(22, 93, 255, 0.2);
            transition: all 0.4s ease;
            min-width: 180px;
        }

        .capability-item:hover {
            background: rgba(22, 93, 255, 0.15);
            border-color: rgba(22, 93, 255, 0.4);
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(22, 93, 255, 0.2);
        }

        .capability-icon {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .capability-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .capability-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            line-height: 1.6;
        }

        /* 四大Agent标签 */
        .agents {
            display: flex;
            gap: 20px;
            margin-top: 60px;
            animation: agentsFadeIn 1s ease-out 2.5s both;
        }

        @keyframes agentsFadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .agent-badge {
            padding: 8px 16px;
            background: rgba(22, 93, 255, 0.15);
            border: 1px solid rgba(22, 93, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .agent-badge:hover {
            background: rgba(22, 93, 255, 0.25);
            border-color: rgba(22, 93, 255, 0.5);
            color: #ffffff;
        }

        /* 控制按钮 */
        .controls {
            position: fixed;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .control-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .control-btn:hover {
            background: rgba(22, 93, 255, 0.2);
            border-color: rgba(22, 93, 255, 0.4);
        }

        /* 进度条 */
        .progress-bar {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            animation: progressFadeIn 1s ease-out 3s both;
        }

        @keyframes progressFadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #165DFF 0%, #00D4FF 100%);
            animation: progressFill 5s ease-in-out 3s forwards;
        }

        @keyframes progressFill {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .logo-image {
                width: 120px;
                height: 120px;
            }

            .title {
                font-size: 36px;
                letter-spacing: 6px;
            }

            .subtitle {
                font-size: 14px;
            }

            .capabilities {
                flex-direction: column;
                gap: 20px;
                padding: 0 20px;
            }

            .capability-item {
                padding: 20px;
                min-width: auto;
            }

            .agents {
                flex-wrap: wrap;
                justify-content: center;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 控制按钮 -->
    <div class="controls">
        <button class="control-btn" onclick="replay()">重新播放</button>
    </div>

    <!-- Logo容器 -->
    <div class="logo-container">
        <div class="logo-glow"></div>
        <img src="../yi.jpg" alt="一鉴到底" class="logo-image" id="logo">
        <h1 class="title">一鉴到底</h1>
        <p class="subtitle">AI Agent安全平台</p>
    </div>

    <!-- 核心能力 -->
    <div class="capabilities">
        <div class="capability-item">
            <span class="capability-icon">🛡️</span>
            <div class="capability-title">实时监控</div>
            <div class="capability-desc">AI Agent行为<br/>全链路追踪</div>
        </div>
        <div class="capability-item">
            <span class="capability-icon">🚫</span>
            <div class="capability-title">风险拦截</div>
            <div class="capability-desc">Prompt注入<br/>权限绕过防护</div>
        </div>
        <div class="capability-item">
            <span class="capability-icon">📜</span>
            <div class="capability-title">审计存证</div>
            <div class="capability-desc">司法级存证<br/>可追溯可验证</div>
        </div>
        <div class="capability-item">
            <span class="capability-icon">⚡</span>
            <div class="capability-title">智能裁决</div>
            <div class="capability-desc">四层校验引擎<br/>自动化决策</div>
        </div>
    </div>

    <!-- 四大Agent -->
    <div class="agents">
        <div class="agent-badge">👁️ 审计官</div>
        <div class="agent-badge">✅ 验证官</div>
        <div class="agent-badge">📦 存证官</div>
        <div class="agent-badge">⚖️ 裁决官</div>
    </div>

    <!-- 进度条 -->
    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>

    <script>
        // 重新播放动画
        function replay() {
            const logo = document.getElementById('logo');
            logo.style.animation = 'none';
            setTimeout(() => {
                logo.style.animation = 'logoFadeIn 2s ease-out, breathe 4s ease-in-out infinite 2s';
            }, 10);
        }
    </script>
</body>
</html>
