<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小鉴 - 一鉴到底桌宠</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="pet-container" class="pet-container">
    <!-- 小鉴形象容器 -->
    <div id="pet-avatar" class="pet-avatar state-green">
      <div class="pet-body"></div>
      <div class="pet-head">
        <div class="pet-glasses"></div>
        <div class="pet-eyes">
          <div class="eye left"></div>
          <div class="eye right"></div>
        </div>
        <div class="pet-mouth"></div>
      </div>
      <div class="pet-status-indicator"></div>
    </div>

    <!-- 状态提示 -->
    <div id="status-bubble" class="status-bubble">
      <div class="bubble-content"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
