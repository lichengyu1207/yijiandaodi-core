# /etc/logrotate.d/yijiandaodi-celery
# Celery日志轮转配置
#
# 安装方法:
#   sudo cp logrotate.conf /etc/logrotate.d/yijiandaodi-celery
#   sudo chmod 644 /etc/logrotate.d/yijiandaodi-celery
#
# 测试配置:
#   logrotate -d /etc/logrotate.d/yijiandaodi-celery
#
# 手动触发轮转:
#   logrotate -f /etc/logrotate.d/yijiandaodi-celery

# Celery Worker日志
/var/log/celery/worker*.log
/var/log/celery/errors.log
/var/log/celery/worker_trajectory*.log
/var/log/celery/worker_maintenance*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 celery celery
    sharedscripts
    postrotate
        # 重启Celery Worker以释放旧文件句柄
        /usr/bin/supervisorctl restart celery-worker-trajectory >/dev/null 2>&1 || true
        /usr/bin/supervisorctl restart celery-worker-maintenance >/dev/null 2>&1 || true
    endscript
}

# 监控脚本日志
/var/log/celery-monitor.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 celery celery
}

# Supervisor stdout/stderr日志（如果未在Supervisor配置中设置轮转）
/var/log/celery/*_stdout.log
/var/log/celery/*_stderr.log {
    daily
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    create 0644 celery celery
    size 50M
}

# Django应用日志（如果有单独的日志文件）
/var/log/django/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 www-data www-data
}