# ============================================================
# 一鉴到底 - Docker Compose 编排（生产环境 全栈）
#
# 架构:
#   用户 → :80 前端(Nginx+SPA) → /api/* → 后端(Django)
#                                    → /*    → index.html(SPA)
#
# 启动:   docker compose up -d --build
# 停止:   docker compose down
# 查看日志: docker compose logs -f frontend backend
# ============================================================

version: '3.8'

services:
  # ========== 前端（Nginx 托管 SPA）==========
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: yijiandaodi-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"                     # HTTPS（需配置 SSL 证书）
    volumes:
      - media_volume:/usr/share/nginx/html/media:ro     # 挂载后端媒体文件
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========== Django 后端 ==========
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yijiandaodi-backend
    restart: unless-stopped
    env_file:
      - .env
      - .env.docker                    # Docker 网络覆盖（DB_HOST=db, DEBUG=False 等）
    expose:
      - "8000"                         # 仅内部网络暴露，不对外
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ========== PostgreSQL 数据库 ==========
  db:
    image: postgres:16-alpine
    container_name: yijiandaodi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fangdudu_main}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 数据库不暴露端口到外部，仅内部访问
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fangdudu_main}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Redis（缓存 + Channel Layer + Celery Broker）==========
  redis:
    image: redis:7-alpine
    container_name: yijiandaodi-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========== Celery Worker（异步任务执行）==========
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yijiandaodi-celery-worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.docker
    command: celery -A fangdudu_backend.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=1000 --queues=default,notifications,maintenance,security,analytics
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - logs_volume:/app/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A fangdudu_backend.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ========== Celery Beat（定时任务调度）==========
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yijiandaodi-celery-beat
    restart: unless-stopped
    env_file:
      - .env
      - .env.docker
    command: celery -A fangdudu_backend.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    volumes:
      - logs_volume:/app/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A fangdudu_backend.celery_app inspect scheduled"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

# ========== 数据卷（持久化）==========
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local

# ========== 网络 ==========
networks:
  app-network:
    driver: bridge
