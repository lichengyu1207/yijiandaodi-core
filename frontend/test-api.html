<!DOCTYPE html>
<html>
<head><title>API测试</title></head>
<body>
<h1>一鉴到底 - API 连接测试</h1>
<p>当前协议: <span id="protocol"></span></p>
<p>正在测试后端连接...</p>
<div id="result" style="margin:20px;padding:20px;border:1px solid #ccc;white-space:pre-wrap;"></div>
<script>
document.getElementById('protocol').textContent = window.location.protocol;
fetch('/api/recommendation/promo-card/feed-cards/?limit=1')
  .then(r => r.json())
  .then(d => {
    document.getElementById('result').innerHTML = '<h2 style="color:green">✅ 连接成功！</h2>' + JSON.stringify(d, null, 2);
    document.getElementById('result').style.borderColor = 'green';
  })
  .catch(e => {
    document.getElementById('result').innerHTML = '<h2 style="color:red">❌ 连接失败</h2>' + e.message;
    document.getElementById('result').style.borderColor = 'red';
  });
</script>
</body>
</html>
